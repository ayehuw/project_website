        <div class="photo">
            <section id="usparks" class="country country-photo">
                <h3>United States</h3>
                <div class="photos-flex" >
                    <img src="../img/ys1.jpeg" alt="sunset at Yosemite's Half Dome">
                    <img src="../img/ys2.jpeg" alt="a pond with a backdrop of a small waterfall in the mountains">
                    <img src="../img/ys3.jpeg" alt="a pond surrounded by pine trees and mountains and red branched plants">
                    <img src="../img/ys4.jpeg" alt="a valley of pine trees at Yosemite's Half Dome">
                    <img src="../img/ys5.jpeg" alt="a view of bushes and small trees full of red leaves scattered in a valley sprinkled with snow">
                    <img src="../img/ys7.jpeg" alt="a road in the mountains with an open view, surrounded by red bushes and bare trees">
                    <img src="../img/nc.jpeg" alt="pond of water in valley between mountains with purple flowers in sight.">
                    <img src="../img/wave.jpeg" alt="red toned hills of rocks with patterns that resemble waves etched in the rocks">
                </div>    
            </section>
            <section id="turkey" class="country country-photo">
                <h3>Turkey</h3>
                <div class="photos-flex">
                    <img src="../img/t1.jpeg" alt="dozens of hot air balloons rising together over a landscape of spiked rocks at sunrise">
                    <img src="../img/t2.jpeg" alt="a hot air balloon that uses the Turkish flag as its design flying over valleys of rocks at dawn">
                    <img src="../img/t3.jpeg" alt="three men firing up a hot air balloon">
                    <img src="../img/t4.jpeg" alt="panoramic view of layers of light blue thermal pools on top of shimmering snow-white limestone">
                    <img src="../img/t5.jpeg" alt="side view of layers of light blue thermal pools on top of shimmering snow-white limestone">
                    <img src="../img/t6.jpeg" alt="the Blue Mosque of Istanbul surrounded by a garden park with a fountain">
                    <img src="../img/t7.jpeg" alt="the remains of an ancient building built of stone with red markings">
                    <img src="../img/t8.jpeg" alt="ancient remains of the front of a library building with tourists walking around">
                </div>
            </section>
            <section id="cuba" class="country country-photo">
                <h3>Cuba</h3>
                <div class="photos-flex">
                    <img src="../img/cuba.jpeg" alt="a view overlooking the streets behind the University of Havana with a classic red car driving by">
                    <img src="../img/cuba2.jpeg" alt="a classic green car driving near the docks in Havana">
                    <img src="../img/cuba3.jpeg" alt="the dark insides of a cafe looking out to the sunlit streets and people passing by">
                    <img src="../img/cuba4.jpeg" alt="a plaza building with classic cars parked outside and people on three wheeled taxis passing by">
                    <img src="../img/cuba5.jpeg" alt="a yellow and white classic car driving by the shoreline of Havana">
                    <img src="../img/cuba6.jpeg" alt="a bartender with a row of mojitos prepared and customers sitting by the bar.">
                    <img src="../img/cuba7.jpeg" alt="a bird's-eye view of a home that is covered in murals">
                    <img src="../img/cuba8.jpeg" alt="an airy room with mint green walls and jade green tiles with a desk, a bookshelf and a blue chair">
                    <img src="../img/cuba9.jpeg" alt="an airy bedroom with a blue bed which belonged to Ernest Hemingway">
                    <img src="../img/cuba10.jpeg" alt="an airy living room connected to the dining room">
                    <img src="../img/cuba11.jpeg" alt="a bathroom with the decor of the 50s">
                    <img src="../img/cuba12.jpeg" alt="a classic light yellow car driving in the backstreets of Havana">
                </div>
            </section>
            <section id="nz" class="country country-photo">
                <h3>New Zealand</h3>
                <div class="photos-flex">
                    <img src="../img/nz1.jpeg" alt="a panoramic view of the top of a glacier, with snow covered grounds.">
                    <img src="../img/nz2.jpeg" alt="open view of rocky top of a glacier covered with thick white snow">
                    <img src="../img/nz3.jpeg" alt="open view of glittering snow on top of a glacier">
                    <img src="../img/nz4.jpeg" alt="a river passing through a valley with mountains on the side somewhat covered in snow">
                    <img src="../img/nz5.jpeg" alt="a sapphire blue lake in front of a row of snow white mountains">
                    <img src="../img/nz6.jpeg" alt="a murky blue lake on a cloudy day">
                    <img src="../img/nz7.jpeg" alt="a panoramic view of a murky blue lake on a cloudy day">
                    <img src="../img/nz8.jpeg" alt="vibrant green hills next to a pond reflecting the blue sky">
                </div>
            </section>
